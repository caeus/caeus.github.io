ci:
  typecheck:
    impl:
      FROM: node:22-alpine
      steps:
        - RUN: corepack enable && corepack prepare pnpm@latest --activate
        - COPY: package.json /repo/package.json
        - WORKDIR: /repo
        - RUN: pnpm install --ignore-workspace --prod=false
        - COPY: . /repo
        - RUN: pnpm install --ignore-workspace --prod=false
        - RUN: pnpm exec tsc --noEmit
