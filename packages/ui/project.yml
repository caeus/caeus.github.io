ci:
  install:
    deps:
      - packages/common#ci#pack
      - packages/pnpmfile#ci#export
    exports:
      - /repo/node_modules
    run:
      FROM:
        image: node:22-alpine
      steps:
        - RUN: corepack enable && corepack prepare pnpm@latest --activate
        - COPY:
            from: packages/common#ci#pack
            src: /out/caeus-common-0.0.0.tgz
            dest: /repo/common.tgz
        - COPY:
            from: packages/pnpmfile#ci#export
            src: .pnpmfile.cjs
            dest: /repo/.pnpmfile.cjs
        - COPY:
            src: package.json
            dest: /repo/package.json
        - WORKDIR: /repo
        - RUN: 'printf "allowBuilds:\n  esbuild: true\n" > pnpm-workspace.yaml && pnpm install --prod=false'
  typecheck:
    deps:
      - install
    run:
      FROM:
        target: install
      steps:
        - COPY:
            src: .
            dest: /repo
        - WORKDIR: /repo
        - RUN: pnpm exec tsc --noEmit
