ci:
  scaffold:
    deps:
      - packages/forge#ci#engine
      - packages/forge#ci#ts-ui
    run:
      FROM:
        image: node:22-alpine
      steps:
        - COPY:
            from: packages/forge#ci#engine
            src: /forge
            dest: /forge
        - COPY:
            from: packages/forge#ci#ts-ui
            src: /forge/templates/ts-ui
            dest: /forge/templates/ts-ui
        - RUN: 'node /forge/engine.js --template /forge/templates/ts-ui --data ''{"scope":"caeus","name":"ui","outDir":"../../docs"}'' --out /out'
    exports:
      - /out/
  pnpmfile:
    deps:
      - packages/forge#ci#engine
      - packages/forge#ci#pnpmfile
    run:
      FROM:
        image: node:22-alpine
      steps:
        - COPY:
            from: packages/forge#ci#engine
            src: /forge
            dest: /forge
        - COPY:
            from: packages/forge#ci#pnpmfile
            src: /forge/templates/pnpmfile
            dest: /forge/templates/pnpmfile
        - RUN: 'node /forge/engine.js --template /forge/templates/pnpmfile --data ''{"scope":"caeus"}'' --out /out'
  install:
    deps:
      - packages/common#ci#pack
      - scaffold
      - pnpmfile
    exports:
      - /repo/node_modules
    run:
      FROM:
        image: node:22-alpine
      steps:
        - RUN: corepack enable && corepack prepare pnpm@latest --activate
        - COPY:
            from: packages/common#ci#pack
            src: /out/caeus-common-0.0.0.tgz
            dest: /repo/common.tgz
        - COPY:
            from: pnpmfile
            src: /out/.pnpmfile.cjs
            dest: /repo/.pnpmfile.cjs
        - COPY:
            from: scaffold
            src: /out/package.json
            dest: /repo/package.json
        - WORKDIR: /repo
        - RUN: 'printf "allowBuilds:\n  esbuild: true\n" > pnpm-workspace.yaml && pnpm install --prod=false'
  typecheck:
    deps:
      - install
    run:
      FROM:
        target: install
      steps:
        - COPY:
            src: .
            dest: /repo
        - WORKDIR: /repo
        - RUN: pnpm exec tsc --noEmit
  build:
    deps:
      - install
    run:
      FROM:
        target: install
      steps:
        - COPY:
            src: .
            dest: /repo
        - WORKDIR: /repo
        - RUN: pnpm exec vite build
