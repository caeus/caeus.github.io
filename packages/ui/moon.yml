language: 'typescript'
stack: 'frontend'

tasks:
  dev:
    command: 'pnpm run dev'
    type: 'run'

  build:
    command: 'pnpm run build'
    deps:
      - 'typecheck'
      - 'lint'
      - 'format'

  typecheck:
    command: 'pnpm exec tsc --build --force'

  push:
    script: 'git add -A && git commit -m "build" && git push'
    deps:
      - 'build'
    options:
      runFromWorkspaceRoot: true

  format:
    command: 'pnpm exec prettier --write src/'

  lint:
    command: 'pnpm exec eslint . --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --fix'
