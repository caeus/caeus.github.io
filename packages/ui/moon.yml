language: 'typescript'
stack: 'frontend'
tasks:
    dev:
          command: 'pnpm run dev'
          type: 'run'
    build:
          command: 'pnpm run build'
          deps: 
          - 'typecheck'
          - 'lint'
          - 'format'
    typecheck:
          command: 'pnpm exec tsc --build --force'
    format:
          command: 'pnpm exec prettier --write src/'
    lint:
          command: 'pnpm exec eslint . --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --fix'
